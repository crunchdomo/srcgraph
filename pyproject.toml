[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srcgraph"
dynamic = ["version"]
description = "Source code in, a queryable two-tier knowledge graph out"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ladybug==0.22.1",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-hcl==1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
describe = ["anthropic>=1"]
mcp = ["mcp>=2"]

[project.scripts]
srcgraph = "srcgraph.cli:main"

[tool.setuptools.packages.find]
include = ["srcgraph*"]

[tool.setuptools.package-data]
srcgraph = ["explorer.html"]

[tool.setuptools.dynamic]
version = { attr = "srcgraph.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
